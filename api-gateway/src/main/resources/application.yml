spring:
  application:
    name: api-gateway
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
      fail-fast: true
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 20

---
# Rutas, rate limits, timeouts y JWT están en config-repo/api-gateway.yml y config-repo/application.yml.
# El perfil "test" no usa Config Server: importa esos mismos ficheros directamente (src/test/resources).
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
