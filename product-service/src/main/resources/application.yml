spring:
  application:
    name: product-service
  cloud:
    config:
      username: ${CONFIG_SERVER_USERNAME}
      password: ${CONFIG_SERVER_PASSWORD}
      fail-fast: true
      retry:
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000
        max-attempts: 20

---
# Toda la configuración (puerto, base de datos, JWT, Eureka, logging...) está en config-repo/.
# El perfil "test" no usa Config Server: trae su propia configuración en src/test/resources.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
